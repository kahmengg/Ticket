services:
  - type: web
    name: ticket-sale-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: RUN_CHECK_SECRET
        sync: false
      - key: ENABLE_SCHEDULER
        value: false
      - key: ENABLE_LIVENATION
        value: true
      - key: ENABLE_TICKETMASTER
        value: true
      - key: SCRAPE_INTERVAL_HOURS
        value: 6
      - key: REMINDER_INTERVAL_MINUTES
        value: 30
      - key: SEND_ALERTS_ON_FIRST_RUN
        value: false
      - key: SALE_REMINDER_HOURS
        value: 24,1
      - key: LIVENATION_SG_EVENTS_URL
        value: https://www.livenation.sg/event/allevents?CountryIds=199&Genres=alternative-and-indie%2Ccountry%2Chip-hop-and-rap%2Cpop%2Crnb-and-soul%2Crock
