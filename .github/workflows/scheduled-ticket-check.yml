name: Scheduled ticket check

on:
  schedule:
    # Run away from the top of the hour, when scheduled Actions are busiest.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-ticket-check
  cancel-in-progress: false

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger secured ticket check
        env:
          TICKET_CHECK_URL: ${{ vars.TICKET_CHECK_URL }}
          RUN_CHECK_SECRET: ${{ secrets.RUN_CHECK_SECRET }}
        run: |
          test -n "$TICKET_CHECK_URL" || { echo "Missing repository variable: TICKET_CHECK_URL"; exit 1; }
          test -n "$RUN_CHECK_SECRET" || { echo "Missing repository secret: RUN_CHECK_SECRET"; exit 1; }

          # This wakes Render and performs a real Supabase query.
          curl --fail-with-body --show-error --silent \
            --max-time 660 --output check-result.json \
            --request POST "${TICKET_CHECK_URL%/}/run-check" \
            --header "Authorization: Bearer $RUN_CHECK_SECRET"
          cat check-result.json
          # Partial failures must surface in Actions instead of looking like an empty successful scan.
          python -c 'import json; r=json.load(open("check-result.json")); assert r.get("sources") and all(s["status"] == "ok" for s in r["sources"]), "A concert source failed or returned partial data"'
